[project]
name = "ms-toolbox"
version = "0.1.4"
description = "MatsubaraSoda 个人工具箱"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MatsubaraSoda", email = "matsubarasoda@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docstring-parser>=0.18.0",
    "pathspec>=1.1.1",
    "platformdirs>=4.14.0",
    "pypdf>=6.21.1",
    "ruamel.yaml>=0.18.0",
    "requests>=2.34.2",
    "websockets>=17.4",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
msh = "ms_toolbox.harness.main:run"
pdf-extract = "ms_toolbox.pdf.main:main"
tag-csv2str = "ms_toolbox.tag.main:cli_tag_csv2str"
tag-tag2nl = "ms_toolbox.tag.main:cli_tag_tag2nl"

[project.urls]
Homepage = "https://github.com/MatsubaraSoda/ms-toolbox"
Issues = "https://github.com/MatsubaraSoda/ms-toolbox/issues"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
